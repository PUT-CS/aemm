name: E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Format check
        run: npx prettier --check .
        working-directory: e2e

      - name: Type check
        run: npm run typecheck
        working-directory: e2e

      - name: Run tests
        run: npm test
        working-directory: e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
